# herdr-router configuration.
# Search order: $HROUTE_CONFIG, ./routing.toml, ~/.config/herdr-router/routing.toml

default_tier = "impl"

# How long to park a target when a limit is hit but no reset time can be parsed.
default_cooldown = "2h"

# Switch away from a subscription once its 5h window is this % used.
# Override per account (max_used) or per target (table form).
default_max_used = 90

# Seconds to watch a freshly prompted agent for a limit message before
# handing control back. Real work keeps running in its pane afterwards.
probe_seconds = 10

# ---- Classification --------------------------------------------------------
# `rules` : first matching regex wins (free, instant, predictable).
# `jev`   : rules first, then ask Jev on OpenRouter for tasks no rule matched.
#           Needs OPENROUTER_API_KEY in the environment. Optional.
[classifier]
mode = "rules"
jev_model = "typesafe/jev-router"
jev_cost_tier = "low"          # low | medium | high

[[rules]]
tier = "plan"
match = ["\\b(architect|design|plan|rfc|trade-?off|root cause|review)\\b"]

[[rules]]
tier = "quick"
match = ["\\b(grep|find|list|rename|typo|summari[sz]e|explain|format|lint)\\b"]

# ---- Accounts --------------------------------------------------------------
# Optional. Each account is one subscription login. Without this section every
# kind ("claude", "codex") is a single implicit account.
#   Claude: separate logins via CLAUDE_CONFIG_DIR (run `CLAUDE_CONFIG_DIR=~/.claude-work claude` and log in once)
#   Codex : separate logins via CODEX_HOME
# [accounts.claude-work]
# kind = "claude"
# env = { CLAUDE_CONFIG_DIR = "~/.claude-work" }
# max_used = 85
#
# [accounts.codex-personal]
# kind = "codex"
# env = { CODEX_HOME = "~/.codex" }

# ---- Tiers -----------------------------------------------------------------
# A tier is an ordered fallback chain of "account|kind[:model[:effort]]".
# A target is skipped when its account is parked (limit hit) or its 5h usage
# is at/over max_used. `fallback_tier` is where to go when the whole chain is
# unavailable: that is the "switch to something simpler" step.
# Table form for full control:
#   { account = "claude-work", model = "opus", max_used = 70, env = { FOO = "1" } }
[tiers.plan]
chain = ["claude:opus", "codex:gpt-5.5:high", "claude:sonnet"]
fallback_tier = "impl"
description = "Use for architecture decisions, hard debugging, security-sensitive design and reviews."

[tiers.impl]
chain = ["claude:sonnet", "codex:gpt-5.5:medium"]
fallback_tier = "quick"

[tiers.quick]
chain = ["claude:haiku", "codex:gpt-5.5:low"]
description = "Use PROACTIVELY for grep, finding definitions, renames, summaries and small mechanical edits."

# ---- Limit detection -------------------------------------------------------
# Regexes (case-insensitive) matched against the agent's recent terminal output.
# Omit to use the built-in defaults.
# limit_patterns = ["usage limit reached", "5-hour limit reached"]
